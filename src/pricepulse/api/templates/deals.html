{% extends "base.html" %}
{% block title %}{{ source|upper }} deals · PricePulse{% endblock %}
{% block content %}
<header>
  <h1>Current deals</h1>
</header>

<nav class="tabs" role="tablist">
  {% for code in tabs %}
  <a role="tab" aria-selected="{{ 'true' if code == source else 'false' }}" class="badge {{ code }}" href="/?{{ qs(params, source=code, cursor=None) }}">{{ code|upper }} · {{ stats[code].on_sale }} on sale</a>
  {% endfor %}
</nav>

<form id="filters" method="get" action="/"
      hx-get="/" hx-select="#deals-wrap" hx-target="#deals-wrap" hx-swap="outerHTML" hx-push-url="true"
      hx-trigger="change, keyup changed delay:300ms from:#q, submit">
  <input type="hidden" name="source" value="{{ source }}">
  <div class="grid">
    <label>Category
      <select name="category">
        <option value="" {% if not params.category %}selected{% endif %}>All</option>
        {% for c in categories %}
        <option value="{{ c.category }}" {% if params.category == c.category %}selected{% endif %}>{{ c.category }} ({{ c.products }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Sort
      <select name="sort">
        {% for s in sorts %}
        <option value="{{ s }}" {% if params.sort == s %}selected{% endif %}>{{ sort_labels[s] }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Search
      <input type="search" id="q" name="q" value="{{ params.q or '' }}" placeholder="name contains…" maxlength="100">
    </label>
  </div>
  <div class="grid">
    <label>Min discount %
      <input type="number" name="min_discount" value="{{ params.min_discount or 0 }}" min="0" max="100" step="1">
    </label>
    <label>Min price $
      <input type="number" name="min_price" value="{{ params.min_price if params.min_price is not none else '' }}" min="0" step="1" placeholder="0">
    </label>
    <label>Max price $
      <input type="number" name="max_price" value="{{ params.max_price if params.max_price is not none else '' }}" min="0" step="1" placeholder="any">
    </label>
  </div>
  <fieldset>
    <label><input type="checkbox" name="flagged_only" value="true" {% if params.flagged_only %}checked{% endif %}> Retailer-flagged only</label>
    <label><input type="checkbox" name="on_sale_only" value="true" {% if params.on_sale_only %}checked{% endif %}> On sale only</label>
    <noscript><button type="submit">Apply</button></noscript>
  </fieldset>
</form>

<div id="deals-wrap">{% include "partials/deals_table.html" %}</div>
{% endblock %}
