name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"

jobs:
  # Builds the artifacts and publishes a human-readable plan to the run summary. Terraform prints
  # `(sensitive value)` for the API key and database URLs, so nothing secret reaches the summary.
  plan:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked --no-dev
      - run: scripts/build_lambda.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-zips
          path: build/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: preflight Neon API key
        # The neon provider only fails at apply time; an empty/invalid key must never reach a
        # plan that also destroys resources.
        run: |
          set -euo pipefail
          test -n "$NEON_API_KEY" || { echo "::error::NEON_API_KEY secret is not set"; exit 1; }
          curl -fsS -H "Authorization: Bearer $NEON_API_KEY" https://console.neon.tech/api/v2/users/me -o /dev/null \
            || { echo "::error::NEON_API_KEY was rejected by the Neon API"; exit 1; }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform -chdir=infra/envs/dev init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: |
          set -euo pipefail
          terraform -chdir=infra/envs/dev plan -input=false -no-color -out=tf.plan | tee plan.txt
          { echo '```hcl'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Re-plans deliberately: plan files embed sensitive values, so tf.plan is never uploaded as an
  # artifact; only the zips travel between jobs. The `dev` environment holds the approval gate.
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: dev # configure a required reviewer on this environment for a manual apply gate
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-zips
          path: build/

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform -chdir=infra/envs/dev init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: terraform -chdir=infra/envs/dev plan -input=false -out=tf.plan

      - name: terraform apply
        run: terraform -chdir=infra/envs/dev apply -input=false -auto-approve tf.plan

      - name: run migrations
        run: |
          set -euo pipefail
          fn=$(terraform -chdir=infra/envs/dev output -json function_names | jq -r .migrate)
          aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
            --payload '{}' response.json >/dev/null
          cat response.json
          if grep -q '"errorMessage"' response.json; then
            echo "::error::migration failed"; exit 1
          fi

      - name: Invalidate CDN (templates/CSP may have changed)
        run: |
          dist=$(terraform -chdir=infra/envs/dev output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' --query Invalidation.Id --output text
