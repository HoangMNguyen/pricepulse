services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pricepulse
      POSTGRES_USER: pricepulse
      POSTGRES_PASSWORD: pricepulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricepulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
